<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../public/css/style-login.css">
</head>
<body>

    <div class="container">
        <div class="container-form">
            <form class="sing-in" id="Form--Login">

                <h2>Iniciar Sesion</h2>
                <div class="social-container">
                    <ion-icon name="logo-instagram"></ion-icon>
                    <ion-icon name="logo-facebook"></ion-icon>
                    <ion-icon name="logo-tiktok"></ion-icon>
                </div>
                <span> Usa tu correo electronico y contraseña </span>

                <div class="container-input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="email" id="Email--login" name="Email--login" placeholder="correo" required>
                </div>
                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" id="password--login" name="password--login" placeholder="Contraseña" required>
                </div>
                <a href="#">¿Olvidaste tu contraseña?</a>
                <button class="btn">Iniciar Sesion</button>

            </form>
        </div>
        <div class="container-form">
            <form class="sing-up" id="Form--Register">
                <h2>Registrarse</h2>
                <div class="social-container">
                    <ion-icon name="logo-instagram"></ion-icon>
                    <ion-icon name="logo-facebook"></ion-icon>
                    <ion-icon name="logo-tiktok"></ion-icon>
                </div>
                <div class="container-input">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="text" id="first-name" name="first-name" placeholder="Nombre" required>
                </div>
                <div class="container-input">
                    <ion-icon name="person-add-outline"></ion-icon>
                    <input type="text" id="last-name" name="last-name" placeholder="Apellido" required>
                </div>
                <div class="container-input">
                    <ion-icon name="person-circle-outline"></ion-icon>
                    <input type="text" id="username" name="username" placeholder="usuario" required>
                </div>

                <div class="container-input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="email" id="email--register" name="email--register" placeholder="correo" required>
                </div>
                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" id="password--register" name="password--register" placeholder="Contraseña" required>
                </div>
                <button class="btn">Registrarse</button>
            </form>
        </div>
        <div class="container-welcome">
            <div class="welcome-sing-up welcome">
                <h3>¡Bienvenido!</h3>
                <p> ¿Aun no tienes cuenta? Dale a este boton para registrarte</p>
                <button class="btn" id="btn-sing-up">Registrarse</button>
            </div>
            <div class="welcome-sing-in welcome">
                <h3>¡Hola!</h3>
                <p> ¿Ya tienes cuenta? coloca tus datos aqui para ingresar</p>
                <button class="btn" id="btn-sing-in">Iniciar Sesion</button>

            </div>
        </div>
    </div>

    <script src="../public/js/login.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
